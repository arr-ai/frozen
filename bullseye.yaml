  T10:
    name: 'Hashing is seedless end to end: Hashable is Hash() uintptr and scalar keys hash through an inlined mixer'
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: 'Hashable is Hash() uintptr end to end; hash.Any/Int/String/Bytes/Float64/Combine are seedless; scalars and ≤16-byte strings/[]byte go through inlined mix64 (per-process mixKey), longer sequences AES. TestHashSpreadsStructuredKeys PASS: nine 2^16 key families mean depth 4.99–5.00 (ideal 5.33) max 5–6 collision leaves 0. go test -short/-count=1 ./.../-race -short/-tags frozen_vet -short all exit 0; golangci-lint 2.12.2 0 issues; gofmt clean; GOOS=linux builds for 386 arm amd64 arm64 mips mips64 mipsle mips64le ppc64 ppc64le s390x and js/wasm succeed. vcheck PASS 2026-09-12: independent checker re-ran TestHashSpreadsStructuredKeys -v (all families PASS), go test -short/-count=1/-race -short/-tags frozen_vet -short (all exit 0), golangci-lint 2.12.2 0 issues, gofmt -l empty, the twelve GOOS/GOARCH builds, and -gcflags=-m confirming mix64 inlines at every scalar entry. Residue: make lint (Docker v1.60.1) not run; CI pins v2.12.2.'
    acceptance:
    - frozen.Hashable, hash.Hashable and lazy.Set declare Hash() uintptr; Set, Map, IntSet, KeyValue, mapEntry and the lazy sets implement it; no Hash(seed) signature remains outside git history
    - The vendored hash package exposes seedless functions (Any, Int, Uint64, String, Bytes, Float64, ..., Combine); ordered composites (structs, arrays, []any) fold with Combine, not seed chaining
    - 8-byte and narrower scalar keys hash through an inlined 64x64-to-128 multiply-fold mixer keyed by a per-process random value; strings and []byte of at most 16 bytes use the same mixer with distinct type salts, longer sequences use AES; no new assembly
    - A tree-shape test in internal/pkg/tree builds 2^16-element sets from structured key families (sequential ints, high-bit-only ints, multiples of 4096, negative ints, sequential float64, formatted strings, 4-char hex strings) and asserts no collision leaf below maxSplitDepth and a mean depth within one level of log_fanout(n)
    - make test, go test -race -short ./..., make vet, golangci-lint pass; GOOS=linux builds for every GOARCH with assembly succeed
    - README, STABILITY.md and CLAUDE.md describe the seedless Hash() contract
    context: |-
      Owner decision 2026-09-12 (after T8): the seed parameter is dead weight once element hashes are computed once and cached; go fully seedless, accepting the break for custom key types. Measured on this machine while deciding how to implement the leaf path: dependent-chain latency for an 8-byte key is 7.3 ns through the 3-round AES assembly entry (call overhead dominates), 3.9 ns for MurmurHash3 fmix64 inlined, 1.6 ns for a wyhash-style multiply-fold inlined; throughput 3.4 vs 0.78 vs 0.52 ns. The multiply-fold (the mum primitive of wyhash/rapidhash) mixes high and low input bits into the top bits the trie addresses from, unlike plain Fibonacci hashing.

      STATE 2026-09-12 end of session: partially applied and UNCOMMITTED on top of a9c2bf5; the tree does not compile. docs/HANDOFF-T10.md lists exactly what is written (hash.go rewrite, mixer.go, hash_distribution_test.go) and the remaining sites, oracles, benchmarks and the vcheck/achieve/commit sequence. Achieving T10 is expected to achieve T9 as well.
    depends_on:
    - T8
    origin: manual
    discovered: 2026-09-12
    achieved: 2026-09-13
