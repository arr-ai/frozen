  T5:
    name: A Set or Map of any element type builds and queries without panicking
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: 'internal/pkg/value/value.go: (1) the comparability probe now recovers properly (isComparable with a real deferred closure) instead of `defer recover()`, which does not stop a panic; (2) containsInterface keeps == off types that are statically comparable but panic at runtime once an interface field holds an uncomparable value; (3) equalSlow dispatches on the dynamic type''s own Equal method (cached per type) when neither Equaler[T] nor Samer matches, so an `any`-keyed container holding values with Equal(SomeInterface) bool compares correctly rather than silently reporting equal values as unequal. equality_dispatch_test.go covers all three; each test was mutation-checked by reverting its fix and confirming the failure (hash of unhashable type / comparing uncomparable type / ''an equal value must be found''). make ci, go test -race -short ./..., make vet, golangci-lint all clean; Set/Map benchmarks unchanged within noise.'
    acceptance:
    - value.EqualFuncFor's comparability probe recovers properly (`defer func(){ recover() }()`, not `defer recover()`), so a slice-typed element falls through to equalSlow instead of panicking with 'hash of unhashable type'
    - 'equalComparable is not selected for types whose == can panic at runtime (arrays/structs of interfaces): either the probe rejects them or equalComparable recovers like equalBoxed does'
    - Tests cover frozen.Set[[]T] and frozen.Set[[2]any] holding uncomparable dynamic values, for Add, Has, Equal and Union
    - The type-matrix tests gain a slice-element and an array-of-interface-element case
    context: |-
      Found 30 Aug 2026 while evaluating concrete element types for arr.ai relation rows. frozen.Set[rel.Values] (a slice type) panics on construction: EqualFuncFor probes comparability with `_ = map[any]struct{}{i:{}}` guarded by `defer recover()`, which does not recover in Go (verified) — the probe's own panic escapes. frozen.Set[[2]Value] constructs but panics on Has with 'comparing uncomparable type', because equalComparable does a == b on an array of interfaces; this is the same class as the equalBoxed bug fixed in da2db93.

      Achieved 2026-08-31: internal/pkg/value/value.go: (1) the comparability probe now recovers properly (isComparable with a real deferred closure) instead of `defer recover()`, which does not stop a panic; (2) containsInterface keeps == off types that are statically comparable but panic at runtime once an interface field holds an uncomparable value; (3) equalSlow dispatches on the dynamic type's own Equal method (cached per type) when neither Equaler[T] nor Samer matches, so an `any`-keyed container holding values with Equal(SomeInterface) bool compares correctly rather than silently reporting equal values as unequal. equality_dispatch_test.go covers all three; each test was mutation-checked by reverting its fix and confirming the failure (hash of unhashable type / comparing uncomparable type / 'an equal value must be found'). make ci, go test -race -short ./..., make vet, golangci-lint all clean; Set/Map benchmarks unchanged within noise.
    tags:
    - bug
    origin: manual
    discovered: 2026-08-30
    achieved: 2026-08-31
  T7:
    name: Set.Equal never reports distinct sets as equal because of an algebraic hash collision
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: 'Removed FullHash from tree.EqHash and every matching-h0 short-circuit (tree.go, branch.go, leaf.go, leaf2.go, leaf1.go); added root identity check in Tree.Equal. set_nested_equal_test.go reproduces {{1,2},{3}} vs {{1},{2,3}} and the Set-of-Map variant; mutation-checked by making Tree.Equal return true on h0 match, which fails both assertions. go test -short, go test -race -short, go test -tags frozen_vet -short, go test ./... all exit 0; golangci-lint 2.12.2 reports 0 issues. BenchmarkSetOps/Equal 1Mi: Same 24 ns, Near/Sparse ~25 ns, Half/Disjoint ~1.4-1.8 us, Equal (independent builds) 2.6 ms. vcheck PASS 2026-09-12: independent checker re-ran go test -short/-race/-tags frozen_vet/full (-count=1, all exit 0), golangci-lint 2.12.2 (0 issues), TestSetEqualNestedPartitionsDiffer + TestSetEqualSameRootShortCircuits (PASS), and reproduced the mutation (both assertions FAIL when Tree.Equal trusts h0); grep for FullHash/isZero returns no hits. Residue: make lint (Docker, golangci-lint v1.60.1) not run locally.'
    acceptance:
    - '`frozen.NewSet(frozen.NewSet(1, 2), frozen.NewSet(3)).Equal(frozen.NewSet(frozen.NewSet(1), frozen.NewSet(2, 3)))` returns false; the same for sets of maps with the same flattened entries'
    - A matching h0 never short-circuits Equal to true anywhere in the tree (Tree, branch, leaf, leaf2, leaf1); h0 is a rejection filter only, so correctness depends on equal ⇒ equal-hash and never on hash injectivity
    - Pointer-identical trees still compare equal in O(1) via a root identity check
    - A regression test covers nested Set and Set-of-Map partitions with equal flattened content, mutation-checked by making Tree.Equal trust h0 and observing the failure
    - make test, go test -race -short ./..., make vet, golangci-lint all pass
    context: |-
      Found 2026-09-12 while auditing the FullHash short-circuit. Set.Equal returned true when counts and h0 matched without comparing elements. Set.Hash128 returns the raw h0, which is the XOR of element hashes, so for a Set[Set[T]] the outer h0 is the XOR of all leaf elements regardless of partition. Verified: {{1,2},{3}}.Equal({{1},{2,3}}) == true and the same for {(a:1,b:2),(c:3)} vs {(a:1),(b:2,c:3)}. Deterministic, not a 2^-128 event. It was an in-library instance of the general hazard that FullHash made correctness depend on hash injectivity rather than the ordinary equal-implies-equal-hash contract; a user Hash128 over a subset of the fields that Equal compares would break Set.Equal the same way.

      Decision (owner, 2026-09-12): revert the rule rather than patch the hash. The FullHash method was removed from EqHash along with every matching-h0 short-circuit; h0 is rejection-only. Cost measured on Set.Equal 1Mi: rejection paths unchanged (~25 ns Near/Sparse, ~1.4 us Half/Disjoint), Same back to ~24 ns via the root identity check, independently built equal-content sets go from O(1) to a full traversal (~2.6 ms). Set.Hash128 is still a raw XOR; a non-linear finalizer would improve it as a public hash but is no longer a correctness matter.

      Reverted 2026-09-12: Re-attest to carry the vcheck PASS oracle line; no change to the work.
    tags:
    - bug
    origin: manual
    discovered: 2026-09-12
    achieved: 2026-09-12
  T8:
    name: The tree hashes elements with a single 64-bit seedless hash and carries no 128-bit machinery
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: 'Removed tree.H128, internal/pkg/hash/h128.go and every *H128 assembly routine and stub; node h0 and element hashes are uintptr; GetHashFunc hashes once with tree.ElemSeed; hasherFromCached remixes rounds >= 1 with an xor-multiply (no hash call, newHasherWith stays inlined). Removed Hashable128, Set.Hash128, Map.Hash128, mapEntry.Hash128, hash128_test.go and the github.com/arr-ai/hash requirement. Set.Hash(seed) is hash.Uintptr(salt, seed) ^ hash.Uintptr(h0, seed). Oracles on the working tree: go test -short/full/-race/-tags frozen_vet (-count=1) all exit 0; golangci-lint 2.12.2 0 issues; gofmt clean; GOOS=linux builds for 386 arm amd64 arm64 mips mips64 mipsle mips64le ppc64 ppc64le s390x and js/wasm succeed. vcheck PASS 2026-09-12: independent checker re-ran all of the above plus benchstat n=8 against a d32301f worktree: GetFrozenMap1M -5.0%, HasFrozenSet1M -5.0%, InsertFrozenSet1M -1.7%, GetFrozenMap1k +5.0%, HasFrozenSet1k +2.8%, InsertFrozenMap1k within noise (isolated n=10, p=0.81). Residue: the 1k read-path cost is tracked in T9; hash128_test.go was deleted with its API and no replacement test was added, so the hashing clauses rest on the pre-existing TestSetHash, TestPathologicalCollision, TestBadHash and TestRemoveCollider plus inspection.'
    acceptance:
    - tree.H128 and the internal/pkg/hash H128 functions and assembly are gone; node h0 and element hashes are uintptr
    - Element hash is computed once per element with seed 0; deeper addressing rounds derive deterministically from the cached hash without a hash call, and colliding elements live in a collision leaf
    - Hashable128, Set.Hash128, Map.Hash128, mapEntry.Hash128 and the github.com/arr-ai/hash dependency are removed; custom keys hash through Hash(seed) only
    - Set.Hash(seed) is O(1), stable across equal sets, and non-linear in the elements
    - make test, go test -race -short ./..., make vet, golangci-lint pass; the package builds for every GOARCH that has assembly in internal/pkg/hash
    - 1M-element read and insert benchmarks are within noise of d32301f; any residual 1k-element read-path cost is measured and recorded in 🎯T9 rather than hidden
    context: 'Owner decision 2026-09-12 after 🎯T7 removed the hash-equality assumption: 128-bit hashes were introduced (#81, #98) to make trusting hash equality safe; with h0 rejection-only, the extra width is work for no gain. Measured on this machine, 64-bit and 128-bit mixes cost the same (3.4 vs 3.8 ns), and the tree never reaches a second addressing round at fanout 8 without a full 64-bit collision. Public 128-bit surfaces (v1.13.0) are removed by owner choice; callers use Hash(seed).'
    depends_on:
    - T7
    origin: manual
    discovered: 2026-09-12
    achieved: 2026-09-12
  T9:
    name: Read-path element hashing costs no more than the pre-64-bit path
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: 'benchstat n=8 quiet sequential vs d32301f: HasFrozenSet1k 30.88n→20.38n (-34.03%, p=0.000); GetFrozenMap1k 33.53n→23.45n (-30.05%, p=0.000); SetOps/Has/1ki/Hit 30.89n→20.27n (-34.40%, p=0.000); Miss -30.79%. 1k reads beat the pre-64-bit path. mix64 inlines; no new assembly or build tags. vcheck PASS 2026-09-12: independent checker re-ran the same 1k benches at d32301f vs the working tree (benchstat n=8): HasFrozenSet1k -31.92%, GetFrozenMap1k -31.14%, SetOps/Has/1ki/Hit -29.81%, Miss -30.90%, all p=0.000; go test -short ./... exit 0; -gcflags=-m shows mix64 inlined; git diff d32301f -- ''*.s'' is 819 deletions 0 insertions. Residue: GetHashFunc[int] vs seedless-AES micro-benchmark unrunnable because T10 removed the AES scalar path; the d32301f 1k benches replace it.'
    acceptance:
    - BenchmarkHasFrozenSet1k, BenchmarkGetFrozenMap1k and BenchmarkSetOps/Has/1ki are at or below commit d32301f (benchstat, n>=8, quiet machine)
    - Scalar and ≤16-byte string keys hash through the inlined mixer, not AES; no new assembly
    - No new build tags or dependencies beyond T10's seedless Hash()
    context: 'Found 2026-09-12 while landing 🎯T8. After the 64-bit conversion, Set.Has/Map.Get at 1k elements are 1-2 ns slower (4-7%). Two measured contributors: (1) the seeded aeshash64 assembly entry moves the seed from a general register into the vector unit (VMOV on arm64, MOVQ on amd64) on every call; the dependent-chain latency of the int hash went from 6.76 to 7.41 ns; the old H128 entry was seedless. (2) Node structs shrank by 8-16 bytes and padding them back recovered roughly 1.4 ns of a 4.8 ns gap in one experiment. A third contributor, newHasherWith no longer inlining because hasherFromCached called hash.Uintptr, was fixed in T8 by remixing with an xor-multiply. Candidate fix for (1): a seedless aeshash64 entry for amd64/arm64 (about ten instructions each) selected when the seed is ElemSeed, with the software path unchanged. Whether the residual is worth more assembly is the owner''s call.'
    depends_on:
    - T8
    - T10
    origin: manual
    discovered: 2026-09-12
    achieved: 2026-09-13
