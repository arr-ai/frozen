targets:
  T1:
    name: Map[K,V] hot-path operations avoid per-call allocations
    status: achieved
    value: 8.0
    cost: 2.0
    acceptance:
    - '`Map.Get` and `Map.Without` use cached `EqArgs` instead of allocating per call'
    - '`mapEntryHashFunc` hashes keys directly without boxing through `Hashable` or `hash.Any`'
    - '`string` type has fast-path specializations in `resolveHashFunc`, `resolveSeededHashFunc`, and `EqualFuncFor`'
    - All existing tests pass (`make test`)
    - Benchmarks show improvement for `Map[string,V]` Get/Without operations
    context: Map.Get and Map.Without are high-frequency operations. Each call was allocating a new EqArgs and boxing keys through interfaces. Caching EqArgs per type and using direct hash functions eliminates this overhead.
    origin: manual
    discovered: 2026-03-05
    achieved: 2026-03-08
  T2:
    name: All read operations are zero-alloc
    status: achieved
    value: 8.0
    cost: 2.0
    acceptance:
    - '`Map.Get`, `Map.Has`, `Set.Has` report 0 B/op, 0 allocs/op in benchmarks at 1k and 1M sizes'
    - No regression in throughput (ns/op must not increase)
    - All existing tests pass
    context: Used reflect.Kind dispatch in resolveHashFunc, resolveSeededHashFunc, and EqualFuncFor to catch derived types and route through direct hash/equality functions. Added size-based integer fast-paths to resolveSeededHashFunc.
    origin: manual
    discovered: 2026-03-08
    achieved: 2026-03-08
  T3:
    name: No-op write operations are zero-alloc
    status: achieved
    value: 5.0
    cost: 2.0
    acceptance:
    - '`Map.With` on existing key (same value) reports 0 allocs/op'
    - '`Map.Without` on absent key reports 0 allocs/op'
    - '`Set.With` on existing element reports 0 allocs/op'
    - '`Set.Without` on absent element reports 0 allocs/op'
    - No regression in throughput
    - All existing tests pass
    context: 'Added `same` field to `CombineArgs` for no-op detection. `Set.With` and `Map.With` now use `Tree.WithWith` with cached `CombineArgs` (non-boxing equality/hash via `EqArgs`) and identity checks via `same`. When an element is already present with the same value, leaf nodes return themselves unchanged, short-circuiting all spine allocation. Bonus: mutating inserts also improved (Map.Insert 1k: 12→3 allocs) because the cached EqArgs path avoids boxing through `value.Equal` and `hash.Any`.'
    origin: manual
    discovered: 2026-03-08
    achieved: 2026-03-08
  T4:
    name: Set and Map operations are correct across diverse key/value types
    status: achieved
    value: 8.0
    cost: 2.0
    acceptance:
    - 'A parametric test suite exercises all core operations (With, Without, Has/Get, Union, Intersection, Difference, Equal) for Set and Map across a matrix of types: `int`, `string`, `float64`, `type ID int`, `type Name string`, `type Score float64`, `struct` types, pointer types'
    - '`Set[int]` and `Set[ID]` (where `type ID int`) never produce hash collisions — elements with the same underlying value but different types are independent'
    - '`Map[int, V]` and `Map[ID, V]` behave independently for same underlying key values'
    - Derived-type sets/maps round-trip correctly through all operations (insert N elements, verify Has for all, verify Count, verify Without removes correctly)
    - All tests pass with `-race`
    context: 17 parametric tests in `typematrix_test.go` cover Set and Map across int, string, float64, derived types (ID, Name, Score), and structs. Independence tests verify Set[int]/Set[ID] and Map[int,V]/Map[ID,V] function independently. Large round-trip test exercises 1000-element insert/verify/remove cycle for derived types. All pass with -race.
    origin: manual
    discovered: 2026-03-09
    achieved: 2026-03-09
  T5:
    name: A Set or Map of any element type builds and queries without panicking
    status: achieved
    value: 0.0
    cost: 0.0
    attestation: 'internal/pkg/value/value.go: (1) the comparability probe now recovers properly (isComparable with a real deferred closure) instead of `defer recover()`, which does not stop a panic; (2) containsInterface keeps == off types that are statically comparable but panic at runtime once an interface field holds an uncomparable value; (3) equalSlow dispatches on the dynamic type''s own Equal method (cached per type) when neither Equaler[T] nor Samer matches, so an `any`-keyed container holding values with Equal(SomeInterface) bool compares correctly rather than silently reporting equal values as unequal. equality_dispatch_test.go covers all three; each test was mutation-checked by reverting its fix and confirming the failure (hash of unhashable type / comparing uncomparable type / ''an equal value must be found''). make ci, go test -race -short ./..., make vet, golangci-lint all clean; Set/Map benchmarks unchanged within noise.'
    acceptance:
    - value.EqualFuncFor's comparability probe recovers properly (`defer func(){ recover() }()`, not `defer recover()`), so a slice-typed element falls through to equalSlow instead of panicking with 'hash of unhashable type'
    - 'equalComparable is not selected for types whose == can panic at runtime (arrays/structs of interfaces): either the probe rejects them or equalComparable recovers like equalBoxed does'
    - Tests cover frozen.Set[[]T] and frozen.Set[[2]any] holding uncomparable dynamic values, for Add, Has, Equal and Union
    - The type-matrix tests gain a slice-element and an array-of-interface-element case
    context: |-
      Found 30 Aug 2026 while evaluating concrete element types for arr.ai relation rows. frozen.Set[rel.Values] (a slice type) panics on construction: EqualFuncFor probes comparability with `_ = map[any]struct{}{i:{}}` guarded by `defer recover()`, which does not recover in Go (verified) — the probe's own panic escapes. frozen.Set[[2]Value] constructs but panics on Has with 'comparing uncomparable type', because equalComparable does a == b on an array of interfaces; this is the same class as the equalBoxed bug fixed in da2db93.

      Achieved 2026-08-31: internal/pkg/value/value.go: (1) the comparability probe now recovers properly (isComparable with a real deferred closure) instead of `defer recover()`, which does not stop a panic; (2) containsInterface keeps == off types that are statically comparable but panic at runtime once an interface field holds an uncomparable value; (3) equalSlow dispatches on the dynamic type's own Equal method (cached per type) when neither Equaler[T] nor Samer matches, so an `any`-keyed container holding values with Equal(SomeInterface) bool compares correctly rather than silently reporting equal values as unequal. equality_dispatch_test.go covers all three; each test was mutation-checked by reverting its fix and confirming the failure (hash of unhashable type / comparing uncomparable type / 'an equal value must be found'). make ci, go test -race -short ./..., make vet, golangci-lint all clean; Set/Map benchmarks unchanged within noise.
    tags:
    - bug
    origin: manual
    discovered: 2026-08-30
    achieved: 2026-08-31
